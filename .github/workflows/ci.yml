name: Flutter manual CI

# Deliberately no push/PR triggers; do not launch without approval.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Ensure Android project exists
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --org com.example --project-name global_invoice .; fi
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
